<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Special+Elite&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#EFE7D8;
    --paper:#F8F3E8;
    --ink:#1B2A4A;
    --ink-soft:#4A5A78;
    --teal:#2F6F62;
    --teal-dark:#1F4D43;
    --gold:#C9A227;
    --brick:#A23B3B;
    --line:#D8CDB4;
    --font-display:'Spectral',serif;
    --font-stamp:'Special Elite',monospace;
    --font-body:'Karla',sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:720px;margin:0 auto;padding:20px 16px 60px;}

  .app-header{text-align:center;padding:8px 0 18px;}
  .app-header h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:2rem;
    margin:0 0 4px;
    color:var(--teal-dark);
    letter-spacing:.3px;
  }
  .app-header .tagline{
    margin:0;
    font-size:.9rem;
    color:var(--ink-soft);
    font-style:italic;
  }

  .child-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 2px 14px;
    scrollbar-width:none;
  }
  .child-tabs::-webkit-scrollbar{display:none;}
  .child-tab{
    flex:0 0 auto;
    padding:10px 16px;
    border-radius:999px 999px 4px 4px;
    border:2px solid var(--line);
    background:var(--paper);
    font-family:var(--font-display);
    font-weight:600;
    font-size:.95rem;
    color:var(--ink-soft);
    cursor:pointer;
    position:relative;
    top:0;
    transition:top .15s ease, box-shadow .15s ease;
  }
  .child-tab.active{
    color:#fff;
    border-color:transparent;
    top:-4px;
    box-shadow:0 4px 0 rgba(0,0,0,.08);
  }
  .child-tab.add-child{
    background:transparent;
    border-style:dashed;
    color:var(--ink-soft);
  }

  .panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:0 2px 10px rgba(27,42,74,.05);
  }

  .child-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .child-heading h2{
    font-family:var(--font-display);
    margin:0;
    font-size:1.4rem;
  }
  .stamp-count{
    font-family:var(--font-stamp);
    font-size:.78rem;
    color:var(--ink-soft);
    background:var(--bg);
    padding:5px 10px;
    border-radius:8px;
    border:1px solid var(--line);
  }

  .filters{
    display:flex;
    gap:6px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .filter-btn{
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink-soft);
    padding:6px 12px;
    border-radius:999px;
    font-size:.82rem;
    font-family:var(--font-body);
    font-weight:700;
    cursor:pointer;
  }
  .filter-btn.active{
    background:var(--teal);
    color:#fff;
    border-color:var(--teal);
  }

  .btn-primary{
    background:var(--teal);
    color:#fff;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    font-family:var(--font-body);
    font-weight:700;
    font-size:.95rem;
    cursor:pointer;
    width:100%;
    margin-bottom:16px;
  }
  .btn-primary:active{background:var(--teal-dark);}

  .book-list{display:flex;flex-direction:column;gap:12px;}

  .book-card{
    position:relative;
    border:1px solid var(--line);
    border-left:6px solid var(--ink-soft);
    border-radius:10px;
    padding:14px 14px 12px;
    background:var(--bg);
    overflow:hidden;
  }
  .book-card.estado-leyendo{border-left-color:var(--brick);}
  .book-card.estado-terminado{border-left-color:var(--teal);}
  .book-card.estado-pendiente{border-left-color:var(--gold);}

  .book-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .book-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.08rem;
    margin:0 0 2px;
  }
  .book-author{
    font-size:.85rem;
    color:var(--ink-soft);
    margin:0;
  }
  .book-meta{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:8px;
    align-items:center;
  }
  .badge{
    font-size:.72rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    color:#fff;
    font-family:var(--font-body);
  }
  .badge.leyendo{background:var(--brick);}
  .badge.terminado{background:var(--teal);}
  .badge.pendiente{background:var(--gold);}

  .stars{color:var(--gold);font-size:.9rem;letter-spacing:1px;}
  .book-notes{font-size:.85rem;color:var(--ink-soft);margin:8px 0 0;font-style:italic;}

  .book-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .icon-btn{
    border:1px solid var(--line);
    background:var(--paper);
    padding:6px 10px;
    border-radius:8px;
    font-size:.78rem;
    cursor:pointer;
    color:var(--ink);
    font-family:var(--font-body);
    font-weight:700;
  }
  .icon-btn.danger{color:var(--brick);}

  .stamp{
    position:absolute;
    top:8px;
    right:10px;
    font-family:var(--font-stamp);
    color:var(--teal-dark);
    border:3px solid var(--teal-dark);
    border-radius:8px;
    padding:2px 8px;
    font-size:.72rem;
    transform:rotate(-9deg);
    opacity:.85;
    letter-spacing:.5px;
    background:rgba(255,255,255,.35);
  }
  @keyframes stampIn{
    0%{transform:rotate(-9deg) scale(2.4);opacity:0;}
    60%{transform:rotate(-9deg) scale(.9);opacity:1;}
    100%{transform:rotate(-9deg) scale(1);opacity:.85;}
  }
  .stamp.fresh{animation:stampIn .45s ease-out;}
  @media (prefers-reduced-motion: reduce){
    .stamp.fresh{animation:none;}
  }

  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-soft);
  }
  .empty-state .big{font-size:2rem;display:block;margin-bottom:6px;}

  .lock-screen{
    max-width:360px;
    margin:60px auto;
    text-align:center;
    padding:0 16px;
  }
  .lock-screen .big{font-size:2.6rem;display:block;margin-bottom:10px;}
  .lock-screen h2{
    font-family:var(--font-display);
    margin:0 0 6px;
    color:var(--teal-dark);
  }
  .lock-screen p{color:var(--ink-soft);font-size:.9rem;margin:0 0 18px;}
  .pin-input{
    width:100%;
    text-align:center;
    font-size:1.6rem;
    letter-spacing:10px;
    padding:12px;
    border:2px solid var(--line);
    border-radius:10px;
    font-family:var(--font-stamp);
    background:var(--paper);
    color:var(--ink);
  }
  .pin-error{color:var(--brick);font-size:.85rem;margin-top:10px;min-height:1.2em;}

  .book-cover{
    width:44px;
    height:64px;
    object-fit:cover;
    border-radius:4px;
    border:1px solid var(--line);
    flex:0 0 auto;
    background:var(--paper);
  }
  .search-results{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:6px;
    max-height:260px;
    overflow-y:auto;
  }
  .search-result{
    display:flex;
    gap:10px;
    align-items:center;
    padding:8px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    cursor:pointer;
    text-align:left;
  }
  .search-result:hover{background:var(--bg);}
  .search-result .sr-info{flex:1;min-width:0;}
  .search-result .sr-title{font-weight:700;font-size:.88rem;margin:0;}
  .search-result .sr-author{font-size:.78rem;color:var(--ink-soft);margin:0;}
  .selected-book{
    display:flex;
    gap:10px;
    align-items:center;
    padding:8px;
    background:var(--bg);
    border-radius:8px;
    margin-top:8px;
  }
  .selected-book .sr-info{flex:1;}
  .clear-selection{
    background:none;
    border:none;
    color:var(--brick);
    font-weight:700;
    cursor:pointer;
    font-size:.8rem;
  }
  .search-hint{font-size:.75rem;color:var(--ink-soft);margin:4px 0 0;}

  .overlay{
    position:fixed;inset:0;
    background:rgba(27,42,74,.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .sheet{
    background:var(--paper);
    width:100%;
    max-width:720px;
    border-radius:20px 20px 0 0;
    padding:20px 18px 24px;
    max-height:88vh;
    overflow-y:auto;
  }
  .sheet h3{
    font-family:var(--font-display);
    margin:0 0 14px;
    font-size:1.2rem;
  }
  label{
    display:block;
    font-size:.8rem;
    font-weight:700;
    color:var(--ink-soft);
    margin:12px 0 4px;
  }
  input[type=text], input[type=number], textarea, select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:var(--font-body);
    font-size:.95rem;
    background:#fff;
    color:var(--ink);
  }
  textarea{resize:vertical;min-height:60px;}
  .star-picker{display:flex;gap:4px;margin-top:4px;}
  .star-picker span{font-size:1.6rem;cursor:pointer;color:var(--line);}
  .star-picker span.on{color:var(--gold);}
  .sheet-actions{display:flex;gap:10px;margin-top:18px;}
  .btn-secondary{
    flex:1;
    background:transparent;
    border:1px solid var(--line);
    padding:11px;
    border-radius:10px;
    font-weight:700;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .btn-confirm{
    flex:1;
    background:var(--teal);
    border:none;
    padding:11px;
    border-radius:10px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
  }
  .loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-family:var(--font-stamp);}
  .save-note{
    text-align:center;
    font-size:.72rem;
    color:var(--ink-soft);
    margin-top:22px;
    opacity:.75;
  }
</style>

<div id="app">
  <div class="app-header">
    <h1>📖 Pasaporte Lector</h1>
    <p class="tagline">Cada libro, un sello. Cada niño, su propio pasaporte.</p>
  </div>
  <div id="root" class="loading">Abriendo la biblioteca…</div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'pasaporte-lector-data';
  const PIN_KEY = 'pasaporte-lector-pin';
  const PALETTE = ['#2F6F62','#A23B3B','#C9A227','#4C6A92','#7A5C3E','#8E5B8A'];
  const STATUS_LABELS = {pendiente:'Pendiente', leyendo:'Leyendo', terminado:'Terminado'};

  let data = {children:[], entries:{}};
  let activeChildId = null;
  let activeFilter = 'todos';
  let freshlyFinishedId = null;
  let selectedBookResult = null; // book chosen from Google Books search

  const root = document.getElementById('root');

  // ---- PIN gate ----
  async function getStoredPin(){
    try{
      const res = await window.storage.get(PIN_KEY, true);
      return res && res.value ? res.value : null;
    }catch(e){
      return null;
    }
  }

  async function setStoredPin(pin){
    try{ await window.storage.set(PIN_KEY, pin, true); }catch(e){ console.error(e); }
  }

  async function checkAccess(){
    const existingPin = await getStoredPin();
    if(!existingPin){
      await showPinSetup();
    } else {
      await showPinEntry(existingPin);
    }
  }

  function showPinSetup(){
    return new Promise(resolve=>{
      root.className = '';
      root.innerHTML = `
        <div class="lock-screen">
          <span class="big">🔐</span>
          <h2>Crea un PIN familiar</h2>
          <p>Este PIN protegerá el pasaporte lector. Compártelo solo con tu familia.</p>
          <input type="text" inputmode="numeric" maxlength="4" class="pin-input" id="pin-setup-input" placeholder="••••">
          <p class="pin-error" id="pin-setup-error"></p>
          <button class="btn-primary" id="pin-setup-confirm" style="margin-top:12px;">Crear PIN</button>
        </div>
      `;
      const input = document.getElementById('pin-setup-input');
      input.focus();
      document.getElementById('pin-setup-confirm').onclick = async () => {
        const val = input.value.trim();
        if(!/^\d{4}$/.test(val)){
          document.getElementById('pin-setup-error').textContent = 'El PIN debe tener 4 números.';
          return;
        }
        await setStoredPin(val);
        resolve();
      };
      input.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('pin-setup-confirm').click(); });
    });
  }

  function showPinEntry(correctPin){
    return new Promise(resolve=>{
      root.className = '';
      root.innerHTML = `
        <div class="lock-screen">
          <span class="big">📖</span>
          <h2>Introduce el PIN</h2>
          <p>Solo la familia conoce este PIN.</p>
          <input type="text" inputmode="numeric" maxlength="4" class="pin-input" id="pin-entry-input" placeholder="••••">
          <p class="pin-error" id="pin-entry-error"></p>
        </div>
      `;
      const input = document.getElementById('pin-entry-input');
      input.focus();
      const tryUnlock = () => {
        if(input.value.trim() === correctPin){
          resolve();
        } else {
          document.getElementById('pin-entry-error').textContent = 'PIN incorrecto.';
          input.value = '';
        }
      };
      input.addEventListener('input', () => { if(input.value.length===4) tryUnlock(); });
      input.addEventListener('keydown', e => { if(e.key==='Enter') tryUnlock(); });
    });
  }

  // ---- Google Books search ----
  let searchDebounce = null;
  async function searchBooks(query, resultsEl){
    if(!query || query.length < 3){ resultsEl.innerHTML = ''; return; }
    try{
      const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=5`);
      const json = await res.json();
      const items = json.items || [];
      if(!items.length){
        resultsEl.innerHTML = '<p class="search-hint">Sin resultados. Puedes escribir los datos a mano.</p>';
        return;
      }
      resultsEl.innerHTML = items.map((item,i)=>{
        const info = item.volumeInfo || {};
        const cover = info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail) : null;
        const author = (info.authors || []).join(', ');
        return `<div class="search-result" data-idx="${i}">
          ${cover ? `<img class="book-cover" src="${cover.replace('http://','https://')}" alt="">` : `<div class="book-cover"></div>`}
          <div class="sr-info">
            <p class="sr-title">${escapeHtml(info.title||'Sin título')}</p>
            <p class="sr-author">${escapeHtml(author)}</p>
          </div>
        </div>`;
      }).join('');
      resultsEl.querySelectorAll('.search-result').forEach(el=>{
        el.onclick = () => {
          const info = items[parseInt(el.dataset.idx,10)].volumeInfo || {};
          const cover = info.imageLinks ? (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail) : null;
          selectedBookResult = {
            title: info.title || '',
            author: (info.authors||[]).join(', '),
            pages: info.pageCount || null,
            cover: cover ? cover.replace('http://','https://') : null
          };
          renderSelectedBook();
        };
      });
    }catch(e){
      resultsEl.innerHTML = '<p class="search-hint">No se pudo buscar ahora. Puedes escribir los datos a mano.</p>';
    }
  }

  function renderSelectedBook(){
    const box = document.getElementById('selected-book-box');
    const searchWrap = document.getElementById('book-search-wrap');
    if(!selectedBookResult){ box.innerHTML=''; searchWrap.style.display=''; return; }
    searchWrap.style.display = 'none';
    box.innerHTML = `
      <div class="selected-book">
        ${selectedBookResult.cover ? `<img class="book-cover" src="${selectedBookResult.cover}" alt="">` : `<div class="book-cover"></div>`}
        <div class="sr-info">
          <p class="sr-title">${escapeHtml(selectedBookResult.title)}</p>
          <p class="sr-author">${escapeHtml(selectedBookResult.author)}</p>
        </div>
        <button class="clear-selection" id="clear-selected-book">Cambiar</button>
      </div>
    `;
    document.getElementById('clear-selected-book').onclick = () => {
      selectedBookResult = null;
      renderSelectedBook();
    };
  }

  function uid(){ return Math.random().toString(36).slice(2,10); }

  async function loadData(){
    try{
      const res = await window.storage.get(STORAGE_KEY, true);
      if(res && res.value){
        data = JSON.parse(res.value);
        if(!data.children) data.children = [];
        if(!data.entries) data.entries = {};
      }
    }catch(e){
      // no existe todavía: empezamos con biblioteca vacía
      data = {children:[], entries:{}};
    }
    if(data.children.length && !activeChildId){
      activeChildId = data.children[0].id;
    }
  }

  async function saveData(){
    try{
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(data), true);
      if(!result){
        console.error('No se pudo guardar');
      }
    }catch(e){
      console.error('Error guardando datos', e);
    }
  }

  function childColor(child){
    const idx = data.children.findIndex(c=>c.id===child.id);
    return PALETTE[idx % PALETTE.length];
  }

  function render(){
    root.className = '';
    if(!data.children.length){
      root.innerHTML = renderNoChildren();
      bindNoChildren();
      return;
    }
    if(!activeChildId || !data.children.find(c=>c.id===activeChildId)){
      activeChildId = data.children[0].id;
    }
    root.innerHTML = renderTabs() + renderPanel();
    bindEvents();
  }

  function renderNoChildren(){
    return `
      <div class="panel empty-state">
        <span class="big">🧳</span>
        <p>Todavía no hay ningún pasaporte creado.<br>Añade el primer lector de la familia.</p>
        <button class="btn-primary" id="btn-add-first-child" style="width:auto;padding:12px 22px;">+ Añadir niño</button>
      </div>
    `;
  }

  function bindNoChildren(){
    document.getElementById('btn-add-first-child').onclick = () => openChildSheet();
  }

  function renderTabs(){
    let html = '<div class="child-tabs">';
    data.children.forEach(c=>{
      const active = c.id === activeChildId;
      const color = childColor(c);
      html += `<button class="child-tab ${active?'active':''}" data-child="${c.id}"
        style="${active?`background:${color};`:''}">${escapeHtml(c.name)}</button>`;
    });
    html += `<button class="child-tab add-child" id="btn-add-child">+</button>`;
    html += '</div>';
    return html;
  }

  function renderPanel(){
    const child = data.children.find(c=>c.id===activeChildId);
    const books = (data.entries[activeChildId] || []).slice().sort((a,b)=> (b.dateAdded||'').localeCompare(a.dateAdded||''));
    const filtered = activeFilter === 'todos' ? books : books.filter(b=>b.status===activeFilter);
    const finishedCount = books.filter(b=>b.status==='terminado').length;

    let html = `<div class="panel">
      <div class="child-heading">
        <h2>${escapeHtml(child.name)}</h2>
        <span class="stamp-count">🏅 ${finishedCount} libro${finishedCount===1?'':'s'} terminado${finishedCount===1?'':'s'}</span>
      </div>
      <div class="filters">
        ${filterBtn('todos','Todos')}
        ${filterBtn('leyendo','Leyendo')}
        ${filterBtn('terminado','Terminados')}
        ${filterBtn('pendiente','Pendientes')}
      </div>
      <button class="btn-primary" id="btn-add-book">+ Añadir libro</button>
      <div class="book-list">`;

    if(!filtered.length){
      html += `<div class="empty-state">
        <span class="big">📗</span>
        <p>${books.length ? 'No hay libros en este filtro.' : 'Todavía no hay libros aquí. ¡Añade el primero!'}</p>
      </div>`;
    } else {
      filtered.forEach(b=>{ html += renderBookCard(b); });
    }
    html += `</div></div>
      <p class="save-note">Los datos se guardan y se comparten con quien tenga este enlace.</p>`;
    return html;
  }

  function filterBtn(key,label){
    return `<button class="filter-btn ${activeFilter===key?'active':''}" data-filter="${key}">${label}</button>`;
  }

  function renderBookCard(b){
    const stars = b.rating ? '★'.repeat(b.rating) + '☆'.repeat(5-b.rating) : '';
    const isFresh = b.id === freshlyFinishedId;
    return `
      <div class="book-card estado-${b.status}">
        ${b.status==='terminado' ? `<div class="stamp ${isFresh?'fresh':''}">LEÍDO${b.dateFinished ? ' · '+b.dateFinished : ''}</div>` : ''}
        <div class="book-top">
          ${b.cover ? `<img class="book-cover" src="${b.cover}" alt="">` : ''}
          <div>
            <p class="book-title">${escapeHtml(b.title)}</p>
            ${b.author ? `<p class="book-author">${escapeHtml(b.author)}</p>` : ''}
          </div>
        </div>
        <div class="book-meta">
          <span class="badge ${b.status}">${STATUS_LABELS[b.status]}</span>
          ${stars ? `<span class="stars">${stars}</span>` : ''}
          ${b.pages ? `<span style="font-size:.78rem;color:var(--ink-soft);">${b.pages} páginas</span>` : ''}
        </div>
        ${b.notes ? `<p class="book-notes">"${escapeHtml(b.notes)}"</p>` : ''}
        <div class="book-actions">
          ${b.status!=='leyendo' ? `<button class="icon-btn" data-action="set-status" data-id="${b.id}" data-status="leyendo">▶ Marcar leyendo</button>` : ''}
          ${b.status!=='terminado' ? `<button class="icon-btn" data-action="set-status" data-id="${b.id}" data-status="terminado">✔ Marcar terminado</button>` : ''}
          ${b.status!=='pendiente' ? `<button class="icon-btn" data-action="set-status" data-id="${b.id}" data-status="pendiente">⏸ Pendiente</button>` : ''}
          <button class="icon-btn danger" data-action="delete-book" data-id="${b.id}">🗑 Borrar</button>
        </div>
      </div>
    `;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function bindEvents(){
    document.querySelectorAll('.child-tab[data-child]').forEach(btn=>{
      btn.onclick = () => { activeChildId = btn.dataset.child; activeFilter='todos'; render(); };
    });
    const addChildBtn = document.getElementById('btn-add-child');
    if(addChildBtn) addChildBtn.onclick = () => openChildSheet();

    document.querySelectorAll('.filter-btn').forEach(btn=>{
      btn.onclick = () => { activeFilter = btn.dataset.filter; render(); };
    });

    const addBookBtn = document.getElementById('btn-add-book');
    if(addBookBtn) addBookBtn.onclick = () => openBookSheet();

    document.querySelectorAll('[data-action="set-status"]').forEach(btn=>{
      btn.onclick = () => setStatus(btn.dataset.id, btn.dataset.status);
    });
    document.querySelectorAll('[data-action="delete-book"]').forEach(btn=>{
      btn.onclick = () => deleteBook(btn.dataset.id);
    });
  }

  async function setStatus(bookId, status){
    const list = data.entries[activeChildId] || [];
    const book = list.find(b=>b.id===bookId);
    if(!book) return;
    book.status = status;
    if(status === 'terminado'){
      book.dateFinished = todayStr();
      freshlyFinishedId = book.id;
    } else {
      book.dateFinished = null;
      if(freshlyFinishedId === book.id) freshlyFinishedId = null;
    }
    await saveData();
    render();
    setTimeout(()=>{ freshlyFinishedId = null; }, 700);
  }

  async function deleteBook(bookId){
    data.entries[activeChildId] = (data.entries[activeChildId]||[]).filter(b=>b.id!==bookId);
    await saveData();
    render();
  }

  function todayStr(){
    const d = new Date();
    return d.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'});
  }

  // ---- Sheets (formularios) ----
  function openChildSheet(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.innerHTML = `
      <div class="sheet">
        <h3>Nuevo pasaporte</h3>
        <label for="child-name">Nombre del niño o niña</label>
        <input type="text" id="child-name" placeholder="Ej. Martina" maxlength="30">
        <div class="sheet-actions">
          <button class="btn-secondary" id="cancel-child">Cancelar</button>
          <button class="btn-confirm" id="confirm-child">Crear pasaporte</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#cancel-child').onclick = () => overlay.remove();
    overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
    overlay.querySelector('#confirm-child').onclick = async () => {
      const name = overlay.querySelector('#child-name').value.trim();
      if(!name) return;
      const id = uid();
      data.children.push({id, name});
      data.entries[id] = [];
      activeChildId = id;
      await saveData();
      overlay.remove();
      render();
    };
  }

  function openBookSheet(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    let rating = 0;
    selectedBookResult = null;
    overlay.innerHTML = `
      <div class="sheet">
        <h3>Añadir libro</h3>
        <div id="book-search-wrap">
          <label for="book-search">Busca el libro (título o autor)</label>
          <input type="text" id="book-search" placeholder="Escribe al menos 3 letras…">
          <div class="search-results" id="book-search-results"></div>
          <p class="search-hint">O si no lo encuentras, escribe los datos abajo a mano.</p>
        </div>
        <div id="selected-book-box"></div>
        <label for="book-title">Título</label>
        <input type="text" id="book-title" placeholder="Ej. El Principito" maxlength="120">
        <label for="book-author">Autor (opcional)</label>
        <input type="text" id="book-author" maxlength="80">
        <label for="book-status">Estado</label>
        <select id="book-status">
          <option value="leyendo">Leyendo ahora</option>
          <option value="terminado">Ya lo terminó</option>
          <option value="pendiente">Pendiente / quiere leerlo</option>
        </select>
        <label for="book-pages">Páginas (opcional)</label>
        <input type="number" id="book-pages" min="1" max="3000">
        <label>Valoración (opcional)</label>
        <div class="star-picker" id="star-picker">
          ${[1,2,3,4,5].map(n=>`<span data-n="${n}">★</span>`).join('')}
        </div>
        <label for="book-notes">Notas (opcional)</label>
        <textarea id="book-notes" placeholder="¿Qué le pareció?"></textarea>
        <div class="sheet-actions">
          <button class="btn-secondary" id="cancel-book">Cancelar</button>
          <button class="btn-confirm" id="confirm-book">Guardar libro</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    const searchInput = overlay.querySelector('#book-search');
    const resultsEl = overlay.querySelector('#book-search-results');
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      const q = searchInput.value.trim();
      searchDebounce = setTimeout(() => searchBooks(q, resultsEl), 400);
    });

    const stars = overlay.querySelectorAll('#star-picker span');
    stars.forEach(s=>{
      s.onclick = () => {
        rating = parseInt(s.dataset.n,10) === rating ? 0 : parseInt(s.dataset.n,10);
        stars.forEach(st => st.classList.toggle('on', parseInt(st.dataset.n,10) <= rating));
      };
    });

    overlay.querySelector('#cancel-book').onclick = () => overlay.remove();
    overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
    overlay.querySelector('#confirm-book').onclick = async () => {
      const manualTitle = overlay.querySelector('#book-title').value.trim();
      const title = selectedBookResult ? selectedBookResult.title : manualTitle;
      if(!title) return;
      const status = overlay.querySelector('#book-status').value;
      const manualPages = overlay.querySelector('#book-pages').value;
      const book = {
        id: uid(),
        title,
        author: selectedBookResult ? selectedBookResult.author : overlay.querySelector('#book-author').value.trim(),
        pages: (selectedBookResult && selectedBookResult.pages) ? selectedBookResult.pages : (manualPages || null),
        cover: selectedBookResult ? selectedBookResult.cover : null,
        status,
        rating: rating || null,
        notes: overlay.querySelector('#book-notes').value.trim(),
        dateAdded: todayStr(),
        dateFinished: status === 'terminado' ? todayStr() : null
      };
      if(!data.entries[activeChildId]) data.entries[activeChildId] = [];
      data.entries[activeChildId].push(book);
      if(status === 'terminado') freshlyFinishedId = book.id;
      await saveData();
      overlay.remove();
      render();
      setTimeout(()=>{ freshlyFinishedId = null; }, 700);
    };
  }

  checkAccess().then(() => loadData().then(render));
})();
</script>
